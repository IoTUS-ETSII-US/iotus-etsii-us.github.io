theme = "blowfish"

# URL de GitHub Pages para este repo (IoTUS-ETSII-US/iotus-etsii-us.github.io,
# página de organización, así que sin subruta). El workflow de deploy
# (.github/workflows/hugo.yml) la sobreescribe en build con --baseURL usando
# actions/configure-pages, así que este valor solo se usa en local (hugo
# server / hugo sin flags).
baseURL = "https://iotus-etsii-us.github.io/"

defaultContentLanguage = "es"
mainSections = ["proyectos", "blog", "eventos"]

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
# Los eventos se anuncian antes de que ocurran (fecha futura) — sin esto
# Hugo los excluye del build por completo, no solo del listado.
buildFuture = true

enableEmoji = true

[pagination]
  pagerSize = 12

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "date"
        weight = 10
